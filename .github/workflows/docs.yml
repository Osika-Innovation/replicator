name: Replicator handbook
on:
  push:
    branches: [main]
    paths: ['docs/**', 'papers/**', 'tools/*docs.py', 'tools/check_physics_derivations.py', '.github/workflows/docs.yml']
  pull_request:
    paths: ['docs/**', 'papers/**', 'tools/*docs.py', 'tools/check_physics_derivations.py', '.github/workflows/docs.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: handbook-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r docs/requirements.txt
      - run: python tools/build_docs.py
      - run: python tools/check_docs.py
      - name: Check published shell calculations
        run: |
          python tools/check_physics_derivations.py > /tmp/physics-check.json
          diff -u docs/assets/physics/atomic-structure-check.json /tmp/physics-check.json
      - uses: actions/upload-pages-artifact@v4
        if: github.ref == 'refs/heads/main'
        with:
          path: _site
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
