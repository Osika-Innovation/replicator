<text x='48.0' y='646.0'>P0 aperture plate A1 — 4 × 4 transmitters, 40 kHz. Seen from the cans' side; channel numbers as the twin's.</text>
<text x='48.0' y='670.0'>Plate 130 × 130 × 4 mm, printed PETG, 4 perimeters, 40 % infill. General tolerance ±0.2 mm.</text>
<text x='48.0' y='694.0'>4 rod holes Ø4.4 on a 110 mm square (the frame's datum). 32 pin holes Ø0.9: two per can, 5.0 mm apart along x,</text>
<text x='48.0' y='718.0'>cans at 10.5 mm pitch, centred on the plate. Dashed: the can (Ø9.9 ± 0.3), standing on this side.</text>
<text x='48.0' y='742.0'>Signal pin at −x of each pair, ground at +x. Print two. The upper plate is this part turned over about the x axis: its channel 16 + n is the can facing n.</text>
